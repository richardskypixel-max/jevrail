<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">JevRail</title>
  <desc id="desc">Every decision leaves a receipt. Dark navy banner with mint parallel tracks and a small decision receipt.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#070c14"/></linearGradient>
    <linearGradient id="rail" x2="1"><stop stop-color="#5ee7d5" stop-opacity="0.08"/><stop offset="0.55" stop-color="#5ee7d5"/><stop offset="1" stop-color="#9db5ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c8e6ff" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="398" rx="23" fill="url(#grid)" stroke="#243345"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="60" y="47" width="96" height="27" rx="13.5" fill="#5ee7d5" fill-opacity="0.09" stroke="#5ee7d5" stroke-opacity="0.3"/>
    <text x="108" y="65" text-anchor="middle" font-size="11" letter-spacing="1.8" fill="#5ee7d5">OPEN SOURCE</text>
    <text x="60" y="172" fill="#f5f9ff" font-size="88" font-weight="700" letter-spacing="-4">Jev<tspan fill="#5ee7d5">Rail</tspan></text>
    <text x="64" y="224" fill="#d5dfed" font-size="26" font-weight="400">Every decision leaves a receipt.</text>
    <text x="64" y="265" fill="#8da1b9" font-size="17">Inspectable calls. Recorded costs. Conservative retries.</text>
    <path d="M64 304H622" stroke="#29384a"/>
    <text x="64" y="337" fill="#8da1b9" font-size="12" letter-spacing="1.2">TYPESCRIPT + NODE.JS</text>
    <circle cx="256" cy="332" r="2" fill="#5ee7d5"/>
    <text x="274" y="337" fill="#8da1b9" font-size="12" letter-spacing="1.2">MACOS FIRST</text>
    <circle cx="400" cy="332" r="2" fill="#5ee7d5"/>
    <text x="418" y="337" fill="#8da1b9" font-size="12" letter-spacing="1.2">ZERO RUNTIME DEPS</text>
  </g>
  <g fill="none" stroke="url(#rail)" stroke-linecap="round">
    <path d="M726 316H855Q898 316 898 273V162Q898 120 942 120H1198" stroke-width="3"/>
    <path d="M726 338H877Q920 338 920 295V184Q920 142 964 142H1198" stroke-width="3"/>
  </g>
  <g transform="translate(973 178)">
    <rect x="10" y="-11" width="196" height="145" rx="16" fill="#162436" stroke="#34465e"/>
    <path d="M0 8Q0 0 8 0H176Q184 0 184 8V150L166 140 148 150 130 140 112 150 94 140 76 150 58 140 40 150 22 140 0 150Z" fill="#101b29" stroke="#526a84"/>
    <circle cx="28" cy="29" r="7" fill="#5ee7d5"/>
    <path d="M51 29H146M23 61H160M23 80H137M23 99H112" stroke="#8198b2" stroke-width="5" stroke-linecap="round"/>
    <text x="24" y="125" font-family="ui-monospace, monospace" font-size="11" fill="#5ee7d5">REQUEST / RESULT / COST</text>
  </g>
  <circle cx="898" cy="235" r="6" fill="#5ee7d5"/>
  <circle cx="1196" cy="120" r="5" fill="#a7bfff"/>
</svg>
